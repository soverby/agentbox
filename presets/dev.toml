# Package registries for in-box user-space installs (PLAN §2.2).
# Sources (fetched 2026-09-23):
#   PyPI: https://docs.pypi.org/api/ (pypi.org simple API, files.pythonhosted.org files)
#   npm: https://docs.npmjs.com/cli/using-npm/registry (registry.npmjs.org)
#   crates.io: https://doc.rust-lang.org/cargo/reference/registry-index.html
#     (index.crates.io sparse index, static.crates.io downloads)
#   Go: https://go.dev/ref/mod#module-proxy (proxy.golang.org, sum.golang.org)
#   RubyGems: https://guides.rubygems.org/rubygems-org-api/ (rubygems.org, index.rubygems.org)
#   python-build-standalone (uv python install): astral-sh/uv
#     crates/uv-python/src/downloads.rs -> github.com/astral-sh/python-build-standalone
#     releases (redirects to release-assets.githubusercontent.com) and the
#     releases.astral.sh mirror.
domains = [
  "pypi.org",
  "files.pythonhosted.org",
  "registry.npmjs.org",
  "crates.io",
  "index.crates.io",
  "static.crates.io",
  "proxy.golang.org",
  "sum.golang.org",
  "rubygems.org",
  "index.rubygems.org",
  "github.com",
  "release-assets.githubusercontent.com",
  "releases.astral.sh",
]
