<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 144" width="560" height="144" role="img" aria-label="agentbox">
  <g transform="translate(8,8)">
  <defs>
    <linearGradient id="agentbox-logo-dark-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C7D2FE"/>
      <stop offset="1" stop-color="#A5B4FC"/>
    </linearGradient>
    <linearGradient id="agentbox-logo-dark-left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="agentbox-logo-dark-right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
    <radialGradient id="agentbox-logo-dark-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FDE68A" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FDE68A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- box -->
  <polygon points="64,16 110,42 64,68 18,42" fill="url(#agentbox-logo-dark-top)"/>
  <polygon points="18,42 64,68 64,116 18,90" fill="url(#agentbox-logo-dark-left)"/>
  <polygon points="64,68 110,42 110,90 64,116" fill="url(#agentbox-logo-dark-right)"/>
  <polyline points="18,42 64,68 110,42" fill="none" stroke="#EEF2FF" stroke-opacity="0.55" stroke-width="1.5" stroke-linejoin="round"/>
  <line x1="64" y1="68" x2="64" y2="116" stroke="#EEF2FF" stroke-opacity="0.35" stroke-width="1.5"/>
  <!-- terminal prompt on the right face -->
  <g transform="matrix(1,-0.5652,0,1,64,68)">
    <polyline points="9,9 22,26 9,28" fill="none" stroke="#67E8F9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="25" y1="40" x2="38" y2="40" stroke="#67E8F9" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- the agent: a spark on the lid -->
  <circle cx="64" cy="40" r="15" fill="url(#agentbox-logo-dark-glow)"/>
  <path d="M64 27 C65.4 35.2 67.8 37.6 76 39 C67.8 40.4 65.4 42.8 64 51 C62.6 42.8 60.2 40.4 52 39 C60.2 37.6 62.6 35.2 64 27 Z" fill="#F59E0B"/>
</g>
  <text x="150" y="97" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="-2"><tspan fill="#EEF2FF">agent</tspan><tspan fill="#A5B4FC">box</tspan></text>
</svg>
